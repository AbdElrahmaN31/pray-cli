name: Commit Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR commits follow Conventional Commits
        run: |
          COMMITS=$(git log --format='%s' origin/${{ github.base_ref }}..HEAD)
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?(!)?: .+'
          FAILED=0

          while IFS= read -r msg; do
            if [ -z "$msg" ]; then
              continue
            fi
            # Skip auto-generated merge commits
            if echo "$msg" | grep -Eq '^Merge '; then
              continue
            fi
            if ! echo "$msg" | grep -Eq "$PATTERN"; then
              echo "::error::Invalid commit message: '$msg'"
              echo "  Expected format: <type>[optional scope]: <description>"
              echo "  Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
              FAILED=1
            fi
          done <<< "$COMMITS"

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::Some commits do not follow the Conventional Commits specification."
            echo "See: https://www.conventionalcommits.org/"
            exit 1
          fi

          echo "All commits follow Conventional Commits format."
