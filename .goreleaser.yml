# GoReleaser configuration for pray-cli
# Documentation: https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: pray
    main: ./cmd/pray
    binary: pray
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: pray-archives
    builds:
      - pray
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--yes"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Performance Improvements"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "Other Changes"
      order: 999

release:
  github:
    owner: AbdElrahmaN31
    name: pray-cli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  footer: |
    ## Installation

    ### Quick Install (Recommended)
    ```bash
    curl -sSL https://raw.githubusercontent.com/AbdElrahmaN31/pray-cli/main/install.sh | sh
    ```

    ### Using Go
    ```bash
    go install github.com/AbdElrahmaN31/pray-cli/cmd/pray@latest
    ```

    ### Download Binary
    Download the appropriate binary for your platform from the assets below:
    - **Linux**: `pray-cli_{{.Version}}_linux_amd64.tar.gz`
    - **macOS (Intel)**: `pray-cli_{{.Version}}_darwin_amd64.tar.gz`
    - **macOS (Apple Silicon)**: `pray-cli_{{.Version}}_darwin_arm64.tar.gz`
    - **Windows**: `pray-cli_{{.Version}}_windows_amd64.zip`

    ### Quick Start
    ```bash
    # Interactive setup
    pray init

    # Auto-detect location
    pray config detect --save

    # Show prayer times
    pray
    ```

    **Full documentation**: https://github.com/AbdElrahmaN31/pray-cli
